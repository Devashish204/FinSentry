services:
  postgres:
    image: postgres:17
    container_name: finsentry-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_HOST_PORT}:5432"

    volumes:
      - finsentry_postgres_data:/var/lib/postgresql/data

volumes:
  finsentry_postgres_data: